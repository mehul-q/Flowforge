services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge
      POSTGRES_DB: flowforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowforge"]
      interval: 2s
      timeout: 2s
      retries: 10

  api:
    build: .
    command: node dist/src/api/server.js
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
      JWT_SECRET: dev-secret-at-least-32-characters-long
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: node dist/src/engine/worker-process.js worker-docker
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
    depends_on:
      postgres:
        condition: service_healthy

  reaper:
    build: .
    command: node dist/src/engine/reaper-process.js
    environment:
      DATABASE_URL: postgresql://flowforge:flowforge@postgres:5432/flowforge
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  pgdata: